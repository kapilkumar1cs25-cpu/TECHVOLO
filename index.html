<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVolo | Kapil Kumar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #000; color: #fff; overflow-x: hidden; }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('techvolo_bg.jpeg'); background-size: cover;
            background-position: center; opacity: 0.4; z-index: -2;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 6%; background-image: url('header_bg.jpeg'); 
            background-size: cover; position: sticky; top: 0; z-index: 1000;
        }

        header::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 1;
        }

        .logo-container, nav { position: relative; z-index: 2; }
        .logo-container img { height: 75px; width: 75px; border-radius: 50%; object-fit: cover; }

        nav ul { display: flex; list-style: none; gap: 30px; }
        nav ul li a { text-decoration: none; color: #fff; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
        nav ul li a:hover { color: #ffcc00; }

        .marquee-container {
            background: #001d3d; border-top: 3px solid #ffcc00; border-bottom: 3px solid #ffcc00;
            padding: 12px 0; overflow: hidden; box-shadow: 0 5px 15px rgba(255, 204, 0, 0.2);
        }

        .marquee-text {
            display: inline-block; white-space: nowrap; font-size: 1.2rem; font-weight: 900;
            color: #ffffff; animation: scroll 22s linear infinite;
        }

        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .founder-section {
            display: flex; align-items: center; gap: 20px; padding: 25px 6%;
            background: rgba(255, 255, 255, 0.05); border-bottom: 1px solid #333;
        }

        .follower-badge {
            background: #ffcc00; color: #000; padding: 5px 15px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 900; display: inline-flex; align-items: center;
            gap: 5px; margin-left: 15px; box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .founder-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #ffcc00; object-fit: cover; }

        .hero { text-align: center; padding: 100px 20px; }
        .hero h1 {
            font-size: 5.5rem; font-weight: 900;
            background: linear-gradient(to right, #ff7b00, #00aaff, #ffffff, #ff7b00);
            background-size: 200% auto; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; animation: colorFlow 6s linear infinite;
        }
        @keyframes colorFlow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

        .cta-btn {
            background: linear-gradient(45deg, #ff4500, #ff8c00, #ffd700);
            color: #000; padding: 20px 60px; border-radius: 50px; border: none;
            font-weight: 900; font-size: 1.2rem; cursor: pointer; text-transform: uppercase;
            transition: 0.4s; margin-top: 30px;
        }

        .account-section {
            max-width: 500px; margin: 50px auto; padding: 40px;
            background: rgba(20, 20, 20, 0.9); border: 2px solid #ff8c00;
            border-radius: 20px; text-align: center;
        }

        .account-section input {
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid #444; background: #111; color: #fff;
        }

        .account-section button {
            width: 100%; padding: 15px; background: linear-gradient(45deg, #ff4500, #ff8c00);
            border: none; border-radius: 10px; color: #000; font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <div class="logo-container"><img src="5582.jpeg" alt="Logo"></div>
        <nav><ul><li><a href="#">Home</a></li><li><a href="#signup">Follow Us</a></li></ul></nav>
    </header>

    <div class="marquee-container">
        <div class="marquee-text">★ TECHVOLO REVOLUTION: EMPOWERING STUDENTS WITH DIRECT ACCESS TO GLOBAL AI ★</div>
    </div>

    <div class="founder-section">
        <img src="1923.jpeg" alt="Kapil" class="founder-img">
        <div class="founder-info">
            <div style="display: flex; align-items: center;">
                <h2 style="font-size: 1.8rem;">Kapil Kumar</h2>
                <div class="follower-badge">
                    <span>👤</span> <span id="follower-count">100 Followers</span>
                </div>
            </div>
            <p style="color: #ffcc00;">Founder, <span style="color: #00d4ff;">K.D. Jaara</span></p>
        </div>
    </div>

    <section class="hero">
        <h1>BEYOND THE BOARDS</h1>
        <a href="#signup"><button class="cta-btn">Join The Revolution</button></a>
    </section>

    <section class="account-section" id="signup">
        <h2>Create Account</h2>
        <p style="margin-bottom: 25px; color: #00d4ff;">Join the TechVolo community!</p>
        
        <form id="followerForm" name="techvolo-followers" method="POST" data-netlify="true">
            <input type="text" name="full_name" placeholder="Full Name" required>
            <input type="email" name="email_id" placeholder="Email Address" required>
            <input type="tel" name="phone_number" placeholder="Mobile Number" required>
            <button type="submit">Create Account & Follow</button>
        </form>
    </section>

    <script>
        const countDisplay = document.getElementById('follower-count');
        
        // 1. पेज लोड होते ही पुरानी वैल्यू चेक करें
        let followers = localStorage.getItem('totalFollowers') || 100;
        countDisplay.innerText = followers + " Followers";

        // 2. फॉर्म सबमिट होने पर नंबर बढ़ाएं
        document.getElementById('followerForm').addEventListener('submit', function() {
            followers = parseInt(followers) + 1; // 1 बढ़ा दिया
            localStorage.setItem('totalFollowers', followers); // मेमोरी में सेव किया
            countDisplay.innerText = followers + " Followers"; // स्क्रीन पर अपडेट किया
        });
    </script>

</body>
</html>
